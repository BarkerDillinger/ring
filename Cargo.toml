[package]
name = "ring"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "A Linux ICMP reachability, latency, route tracing, and network discovery utility supporting IPv4 and IPv6"

[[bin]]
name = "ring"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
console = "0.16.6"
ctrlc = "3.5.2"
libc = "0.2.189"
serde = { version = "1", features = ["derive"] }
serde_json = "1"